name: FirstCry Restock Tracker

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  track:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-playwright-bs4-requests

      - name: Cache Playwright browsers
        uses: actions/cache@v3
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium

      - name: Install dependencies
        run: |
          pip install playwright beautifulsoup4 requests
          playwright install chromium
          playwright install-deps chromium

      - name: Run tracker (every 60s for 5 minutes)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for i in 1 2 3 4 5; do
            echo "--- Run $i of 5 ---"

            # ✅ Always grab the latest seen_items.txt from remote before running
            git fetch origin
            git checkout origin/main -- seen_items.txt

            python firstcry_bot.py

            # ✅ Force push — no pull needed, no conflicts possible
            git add seen_items.txt
            git diff --staged --quiet || (git commit -m "Update seen_items [skip ci]" && git push --force)

            if [ $i -lt 5 ]; then
              echo "Waiting 60 seconds..."
              sleep 60
            fi
          done
