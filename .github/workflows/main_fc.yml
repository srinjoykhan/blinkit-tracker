name: FirstCry Restock Tracker

on:
  schedule:
    - cron: '*/5 * * * *'   # Runs every 5 minutes
  workflow_dispatch:          # Allows manual trigger from GitHub UI

jobs:
  track:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # Needed to commit seen_items.txt back

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright beautifulsoup4 requests
          playwright install chromium
          playwright install-deps chromium

      - name: Run tracker
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python firstcry_bot.py

      # ✅ This step saves seen_items.txt back to the repo
      # so the next run remembers what was already seen
      - name: Save memory file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_items.txt
          git diff --staged --quiet || git commit -m "Update seen_items [skip ci]"
          git push
